<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;text-align:center;padding:20px;}
canvas{background:#111;margin-top:20px;border-radius:10px;}
button{width:60px;height:60px;margin:5px;font-size:20px;border:none;border-radius:10px;background:#38bdf8;color:white;cursor:pointer;transition:0.2s;}
button:hover{transform:scale(1.1);}
.controls{margin-top:20px;}
#restart{width:130px;}
</style>
</head>
<body>

<h1>Snake Game</h1>
<canvas id="game" width="300" height="300"></canvas>

<div class="controls">
<button onclick="changeDirection('up')">↑</button><br>
<button onclick="changeDirection('left')">←</button>
<button onclick="changeDirection('down')">↓</button>
<button onclick="changeDirection('right')">→</button>
<br>
<button id="restart" onclick="restartGame()">Restart</button>
</div>

<a href="index.html" style="color:#38bdf8;display:block;margin-top:20px;">Back to Home</a>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 15;

let snake, dx, dy, apple, speed, frameCount;

function initGame(){
    snake = [{x:150, y:150}];
    dx = grid; 
    dy = 0;
    apple = {x:Math.floor(Math.random()*20)*grid, y:Math.floor(Math.random()*20)*grid};
    speed = 4; // начальная медленная скорость
    frameCount = 0;
}
initGame();

function restartGame(){
    initGame();
}

function randomPosition() {
    return Math.floor(Math.random()*20)*grid;
}

function gameLoop(){
    requestAnimationFrame(gameLoop);
    frameCount++;
    if(frameCount < 5 - speed) return; // контролируем скорость
    frameCount = 0;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    snake.unshift({x:snake[0].x+dx, y:snake[0].y+dy});

    // съедание яблока
    if(snake[0].x===apple.x && snake[0].y===apple.y){
        apple.x=randomPosition();
        apple.y=randomPosition();
        speed += 0.25; // увеличиваем скорость
    } else snake.pop();

    // рисуем змейку
    ctx.fillStyle='lime';
    snake.forEach(s=>ctx.fillRect(s.x,s.y,grid-1,grid-1));

    // рисуем яблоко
    ctx.fillStyle='red';
    ctx.fillRect(apple.x,apple.y,grid-1,grid-1);

    // столкновения
    if(snake[0].x<0 || snake[0].x>=canvas.width || snake[0].y<0 || snake[0].y>=canvas.height || collision()){
        alert("Game Over!");
        initGame();
    }
}

function collision(){
    for(let i=1;i<snake.length;i++){
        if(snake[i].x===snake[0].x && snake[i].y===snake[0].y) return true;
    }
    return false;
}

function changeDirection(dir){
    if(dir==='up' && dy===0){dx=0; dy=-grid;}
    if(dir==='down' && dy===0){dx=0; dy=grid;}
    if(dir==='left' && dx===0){dx=-grid; dy=0;}
    if(dir==='right' && dx===0){dx=grid; dy=0;}
}

// сенсорное управление для телефона
let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart',e=>{
    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;
});
canvas.addEventListener('touchend',e=>{
    let touchEndX=e.changedTouches[0].clientX;
    let touchEndY=e.changedTouches[0].clientY;
    let dxT=touchEndX-touchStartX;
    let dyT=touchEndY-touchStartY;
    if(Math.abs(dxT)>Math.abs(dyT)){
        if(dxT>0) changeDirection('right'); else changeDirection('left');
    } else {
        if(dyT>0) changeDirection('down'); else changeDirection('up');
    }
});

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
