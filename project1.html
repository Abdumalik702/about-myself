<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e293b;
padding:30px;
border-radius:12px;
width:350px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
text-align:center;
}

.input-box{
display:flex;
margin-top:20px;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:6px 0 0 6px;
}

button{
padding:10px;
border:none;
background:#38bdf8;
color:white;
cursor:pointer;
border-radius:0 6px 6px 0;
}

ul{
list-style:none;
padding:0;
margin-top:20px;
}

li{
background:#334155;
padding:10px;
margin-bottom:10px;
border-radius:6px;
display:flex;
justify-content:space-between;
align-items:center;
}

li.done{
text-decoration:line-through;
opacity:0.6;
}

.delete{
background:red;
border:none;
color:white;
padding:5px 8px;
border-radius:4px;
cursor:pointer;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#38bdf8;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>Todo List</h1>

<div class="input-box">
<input id="taskInput" placeholder="New task...">
<button onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

<a class="back" href="index.html">Back to Portfolio</a>

</div>

<script>

function addTask(){

let input=document.getElementById("taskInput")
let text=input.value

if(text==="") return

let li=document.createElement("li")

li.innerHTML=`
<span onclick="toggleTask(this)">${text}</span>
<button class="delete" onclick="deleteTask(this)">X</button>
`

document.getElementById("taskList").appendChild(li)

input.value=""

}

function toggleTask(el){
el.parentElement.classList.toggle("done")
}

function deleteTask(btn){
btn.parentElement.remove()
}

</script>

</body>
</html>
